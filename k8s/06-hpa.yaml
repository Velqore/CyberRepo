apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cyberrepos-hpa
  namespace: cyberrepos-system
  labels:
    app.kubernetes.io/name: cyberrepos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cyberrepos-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
